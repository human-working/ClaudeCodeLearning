# Edge rate limits (defence in depth; the services also enforce their own limits).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
limit_req_status 429;

upstream auth_service    { server auth:8000; }
upstream matcher_service { server matcher:8000; }

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Shared proxy settings. X-Real-IP is overwritten, never trusted from the client.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    # Edge rate-limit responses as JSON so the SPA can show a helpful message.
    error_page 429 = @too_many;
    location @too_many {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 429 '{"detail":"Too many requests, please wait a minute and try again"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/auth/(login|register)$ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://auth_service;
    }

    location /api/auth/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=30 nodelay;
        proxy_pass http://auth_service;
    }

    location /api/matcher/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=ai_zone burst=5 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://matcher_service;
    }

    location = /api/packages {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=30 nodelay;
        proxy_pass http://matcher_service;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
