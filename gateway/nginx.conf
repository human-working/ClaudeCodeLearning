# API gateway: the single public entry point. Services are only reachable inside the Docker network.
upstream auth_service   { server auth:8000; }
upstream posts_service  { server posts:8000; }
upstream search_service { server search:8000; }

server {
    listen 80;
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/  { proxy_pass http://auth_service; }
    location /posts  { proxy_pass http://posts_service; }
    location /search { proxy_pass http://search_service; }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }
}
