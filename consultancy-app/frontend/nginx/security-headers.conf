# Included in every location: nginx drops inherited add_header directives when a
# location defines its own, so keeping them in one snippet avoids silent gaps.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Enable once served over HTTPS (e.g. behind a TLS-terminating load balancer):
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
