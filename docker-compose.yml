name: microservices

x-healthy: &healthy
  condition: service_healthy

services:
  # ---------- Public entry point ----------
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth: *healthy
      posts: *healthy
      search: *healthy
    restart: unless-stopped

  # ---------- Authentication ----------
  auth:
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql+psycopg://auth:${AUTH_DB_PASSWORD:-auth}@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
    depends_on:
      auth-db: *healthy
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Posts ----------
  posts:
    build: ./services/posts
    environment:
      DATABASE_URL: postgresql+psycopg://posts:${POSTS_DB_PASSWORD:-posts}@posts-db:5432/posts
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      posts-db: *healthy
      redis: *healthy
    restart: unless-stopped

  posts-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posts
      POSTGRES_PASSWORD: ${POSTS_DB_PASSWORD:-posts}
      POSTGRES_DB: posts
    volumes:
      - posts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts -d posts"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Search engine ----------
  search:
    build: ./services/search
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: *healthy
    restart: unless-stopped

  # ---------- Event bus (posts -> search) ----------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  auth-db-data:
  posts-db-data:
  redis-data:
